# VPN-AP dnsmasq configuration — DUAL-AP mode
#
# In dual-AP mode two independent APs run on different radios:
#   - wlan0 (2.4 GHz, SSID TravelRouter)    → 192.168.4.0/24
#   - wlan1 (5 GHz,   SSID TravelRouter-5G) → 192.168.5.0/24
#
# dnsmasq serves DHCP on both interfaces with separate ranges so clients on
# each SSID are isolated at L3 (they can still talk via the Pi's routing
# table; add iptables -j DROP between the subnets if you want hard isolation).

interface=wlan0
interface=wlan1

no-resolv
server=1.1.1.1
server=1.0.0.1

# 2.4 GHz pool
dhcp-range=set:net24,192.168.4.50,192.168.4.150,255.255.255.0,24h
dhcp-option=tag:net24,option:router,192.168.4.1
dhcp-option=tag:net24,option:dns-server,192.168.4.1

# 5 GHz pool
dhcp-range=set:net5g,192.168.5.50,192.168.5.150,255.255.255.0,24h
dhcp-option=tag:net5g,option:router,192.168.5.1
dhcp-option=tag:net5g,option:dns-server,192.168.5.1

domain=vpn.local
local=/vpn.local/

no-hosts
log-dhcp
bind-interfaces
domain-needed
bogus-priv
cache-size=1000
