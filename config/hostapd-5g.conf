# VPN-AP hostapd 5 GHz configuration
#
# Used in DUAL-AP mode for the 5 GHz radio (typically the USB Alfa on wlan1).
# In single-AP mode this file is ignored; hostapd.conf (2.4 GHz) is the only AP.
#
# The `interface=` line below is set by `vpn-ap-mode` at runtime based on the
# selected mode — do NOT hard-code a specific interface name here.

interface=__VPN_AP_IFACE__
driver=nl80211

# 5 GHz — Alfa default. The Pi built-in BCM4345 is also dual-band if you
# ever want to swap roles.
hw_mode=a
channel=36
ieee80211n=1
ieee80211ac=1
# HT40+ means the secondary 20 MHz channel is ABOVE the primary. Required on
# ch 36 so primary (36) + secondary (40) form an 802.11n HT40 pair, which
# 80 MHz VHT then builds on (36/40/44/48).
ht_capab=[HT40+][SHORT-GI-20][SHORT-GI-40][RX-STBC1]
# 80 MHz channel width centered on ch 42 (spans 36/40/44/48)
vht_oper_chwidth=1
vht_oper_centr_freq_seg0_idx=42
vht_capab=[SHORT-GI-80][RX-ANTENNA-PATTERN][TX-ANTENNA-PATTERN]
wmm_enabled=1

# Country code — must match regulatory domain loaded in kernel
country_code=US
ieee80211d=1
ieee80211h=1

# Access Point SSID — change to your preferred name (different from 2.4 GHz
# SSID lets clients choose which band they join).
ssid=TravelRouter-5G

beacon_int=100
dtim_period=2
max_num_sta=40
ignore_broadcast_ssid=0

# WPA2-Personal (same scheme as 2.4 GHz AP)
auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK
wpa_pairwise=CCMP
rsn_pairwise=CCMP

# WiFi password — CHANGE THIS to a strong password
wpa_passphrase=ChangeMe123!

logger_syslog=-1
logger_syslog_level=2
logger_stdout=-1
logger_stdout_level=2
